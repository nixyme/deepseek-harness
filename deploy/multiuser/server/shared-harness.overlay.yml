# Shared multiuser Harness runs behind an authenticated proxy, so the
# loopback-only native OS chooser cannot know which principal is picking.
# Pin the in-browser chooser; its initial list request is rewritten by the
# proxy to the caller's private Workspace root.
- id: directory-picker
  disabled: true
# Shared deployments boot over a low-bandwidth WAN. PDF.js embeds its worker,
# cmaps, fonts, and wasm decoders in one 6.9 MiB browser bundle; defer the
# optional PDF renderer until the plugin graph supports a lazy browser tier.
- id: ui-sidebar-documentpreview
  disabled: true
# Marketplace and model-lens UIs are nonessential on the team server and do not
# participate in session creation, chat delivery, workspace access, or settings.
- id: dsh-market
  disabled: true
- id: modlens
  disabled: true
- id: workspace-controller
  config:
    ownerWorkspaceRoot: !!js process.env.DSH_WORKSPACE ?? ''
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
